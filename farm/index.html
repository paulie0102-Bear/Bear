<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>寶可夢寶貝球餐車經營</title>
<style>
*{box-sizing:border-box}
body{background:#1a252f;color:#fff;font-family:'Courier New',Courier,monospace;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden;image-rendering:pixelated}
button,select,input{font-family:inherit}
#header{width:100%;background:#3e2723;color:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:50}
.currency-group{display:flex;align-items:center;gap:12px}
.currency-item{display:flex;align-items:center;gap:4px}
.currency-icon{width:22px;height:22px;vertical-align:middle;object-fit:contain}
.btn-exchange{background:#e91e63;color:#fff;border:none;padding:4px 8px;font-size:12px;border-radius:4px;cursor:pointer;font-weight:bold;box-shadow:0 2px #ad1457}
.btn-exchange:active{transform:translateY(1px);box-shadow:none}
.btn-kitchen{background:#ff9800;border:none;color:#fff;padding:8px 12px;font-size:14px;font-weight:bold;border-radius:6px;box-shadow:0 3px #b26a00;cursor:pointer}
.btn-kitchen:disabled{opacity:.5;cursor:not-allowed}
#game-wrapper{width:100%;max-width:400px;height:600px;position:relative;background:#4caf50;overflow:hidden;box-shadow:0 0 20px rgba(0,0,0,.5);border-bottom:5px solid #2e7d32}
.grass-top{position:absolute;top:0;left:0;width:100%;height:45px;background:#81c784}
.stone-path{position:absolute;top:310px;left:130px;width:140px;bottom:0;background:#b0bec5;border-left:3px dashed #78909c;border-right:3px dashed #78909c}
.stone-path:before,.stone-path:after{content:'';position:absolute;width:18px;height:8px;background:#90a4ae;opacity:.6}
.stone-path:before{top:55px;left:18px}
.stone-path:after{top:130px;right:20px}
.nav-arrow{position:absolute;top:40%;transform:translateY(-50%);background:rgba(93,64,55,.9);color:#fff;border:3px solid #efebe9;border-radius:50%;width:48px;height:48px;font-size:23px;font-weight:bold;display:flex;justify-content:center;align-items:center;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.4);z-index:35;user-select:none}
#arrow-left{left:10px}
#arrow-right{right:10px}
#truck-container{position:absolute;top:30px;left:30px;width:340px;height:310px;z-index:5}
.pokeball-truck{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:280px;height:280px;border-radius:50%;border:9px solid #2d2d2d;box-shadow:0 12px 18px rgba(0,0,0,.4),inset -12px -12px 0 rgba(0,0,0,.15);z-index:5;cursor:pointer;background-color:#f5f5f5}
.staff-window{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:115px;height:115px;background:rgba(255,255,255,.25);border:4px solid rgba(0,0,0,.3);border-radius:50%;display:flex;justify-content:center;align-items:center;overflow:hidden;z-index:6}
.staff-gif{width:100px;height:100px;object-fit:contain}
.ball-button{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;background:#fff;border:7px solid #2d2d2d;box-shadow:0 0 0 4px rgba(255,255,255,.8),inset 0 0 10px rgba(0,0,0,.2);display:flex;justify-content:center;align-items:center;z-index:10;cursor:pointer}
.food-icon{font-size:44px;line-height:1;user-select:none}
.ball-button:hover{transform:translate(-50%,-50%) scale(1.08)}
.hanging-sign{position:absolute;top:calc(60% + 52px);left:50%;transform:translateX(-50%);background:#f5deb3;border:3px solid #5d4037;border-radius:8px;padding:2px 16px;box-shadow:0 4px 6px rgba(0,0,0,.3);z-index:12;white-space:nowrap;text-align:center;min-width:60px}
.hanging-sign:before,.hanging-sign:after{content:'';position:absolute;top:-8px;width:3px;height:8px;background:#3e2723}
.hanging-sign:before{left:12px}
.hanging-sign:after{right:12px}
.food-status{font-size:16px;font-weight:bold;color:#4e342e}
.food-soldout{font-size:14px;font-weight:bold;color:#d32f2f}
.number-stand{position:absolute;bottom:0;right:10px;width:46px;height:54px;background:#8d6e63;border:3px solid #3e2723;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 6px rgba(0,0,0,.3);z-index:15;cursor:pointer}
.number-stand:before{content:'';position:absolute;bottom:-12px;width:8px;height:12px;background:#3e2723}
.number-stand-title{font-size:9px;color:#f5f5f5;margin-bottom:1px}
.number-stand-num{font-size:20px;font-weight:bold;color:#ffeb3b;text-shadow:1px 1px 0 #000}
.truck-locked-overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;justify-content:center;align-items:center;color:#fff;font-size:20px;font-weight:bold;z-index:30;border-radius:50%}
#customers-layer{position:absolute;inset:0;z-index:25;pointer-events:none}
.customer-container{position:absolute;width:100px;height:120px;display:flex;flex-direction:column;align-items:center;transition:left 6s linear,top 6s linear;z-index:25}
.customer-gif{width:90px;height:90px;object-fit:contain}
.speech-bubble{background:#fff3e0;color:#e65100;font-size:13px;font-weight:bold;padding:4px 8px;border-radius:8px;border:2px solid #ffb74d;box-shadow:0 2px 5px rgba(0,0,0,.3);white-space:nowrap;position:absolute;top:-5px;z-index:2}
.full-modal{display:none;position:fixed;inset:0;width:100vw;height:100vh;background:rgba(0,0,0,.9);z-index:100;flex-direction:column}
.modal-header{background:#5d4037;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:bold;border-bottom:3px solid #3e2723;flex-shrink:0}
.btn-close{background:#e74c3c;color:#fff;border:none;padding:6px 12px;font-size:14px;border-radius:6px;cursor:pointer}
.modal-content{flex:1;padding:12px;overflow-y:auto;background:#efebe9;color:#3e2723}
.config-section{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.config-title{font-size:16px;font-weight:bold;margin-bottom:10px;color:#d35400}
.skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin-card{border:2px solid #bbb;border-radius:8px;padding:7px;background:#fafafa;text-align:center;cursor:pointer;position:relative}
.skin-card.selected{border-color:#ff9800;box-shadow:0 0 0 2px #ffcc80}
.skin-card.locked{opacity:.7}
.skin-preview{width:50px;height:50px;border-radius:50%;margin:0 auto 5px;border:3px solid #222;position:relative;background-color:#f5f5f5}
.skin-preview:after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #222}
.skin-name{font-size:11px;font-weight:bold}
.skin-price{font-size:10px;color:#d81b60;margin-top:3px;display:flex;align-items:center;justify-content:center;gap:2px}
.skin-state{font-size:10px;color:#4caf50;margin-top:3px}
.staff-row{display:flex;align-items:center;gap:12px;padding:8px;border:2px solid #ddd;border-radius:8px;margin-bottom:8px;cursor:pointer}
.staff-row.selected{border-color:#ff9800;background:#fff8e1}
.staff-row img{width:65px;height:65px;object-fit:contain}
.staff-info{flex:1}
.staff-name{font-weight:bold;font-size:14px}
select,input{width:100%;padding:8px;margin-top:5px;margin-bottom:8px;border:1px solid #bdc3c7;border-radius:5px;font-size:14px}
.recipe-list{display:flex;flex-direction:column;gap:8px}
.recipe-row{border:2px solid #ddd;border-radius:8px;padding:8px;display:flex;align-items:center;gap:8px;cursor:pointer}
.recipe-row.selected{border-color:#ff9800;background:#fff8e1}
.recipe-icon{font-size:30px;width:42px;text-align:center}
.recipe-info{flex:1}
.recipe-name{font-size:13px;font-weight:bold}
.recipe-price{font-size:11px;color:#e67e22}
.stock-info{font-size:12px;color:#555;margin-top:3px}
.stock-control{width:70px;text-align:center;margin:0}
.stock-summary{background:#fff3cd;border:1px solid #ffe082;border-radius:6px;padding:8px;font-size:13px;margin-top:8px}
.confirm-wrap{padding:12px;background:#5d4037;flex-shrink:0}
.btn-confirm{width:100%;background:#4caf50;color:#fff;border:none;padding:13px;border-radius:8px;font-size:17px;font-weight:bold;box-shadow:0 4px #2e7d32;cursor:pointer}
.btn-confirm:active{transform:translateY(2px);box-shadow:0 2px #2e7d32}
.shop-item{background:#fff;border:1px solid #bdc3c7;border-radius:8px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.shop-price{color:#d81b60;font-size:13px;display:flex;align-items:center;gap:3px;font-weight:bold}
/* ==================== 寶可夢球外觀 ==================== */

/* --- Poké Ball --- */
.ball-skin-poke{
    background:
    radial-gradient(circle at 50% 50%,#fff 0 9%,#2d2d2d 10% 14%,transparent 15%),
    linear-gradient(to bottom,#e53935 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

/* --- Great Ball --- */
.ball-skin-great{
    background:
    radial-gradient(circle at 50% 50%,#fff 0 9%,#2d2d2d 10% 14%,transparent 15%),
    linear-gradient(135deg,transparent 38%,#e53935 39% 47%,transparent 48%) 0 0/50% 47% no-repeat,
    linear-gradient(45deg,transparent 38%,#e53935 39% 47%,transparent 48%) 100% 0/50% 47% no-repeat,
    linear-gradient(to bottom,#1976d2 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

/* --- Ultra Ball --- */
.ball-skin-ultra{
    background:
    radial-gradient(circle at 50% 50%,#fff 0 9%,#2d2d2d 10% 14%,transparent 15%),

    linear-gradient(30deg,transparent 37%,#fdd835 38% 48%,transparent 49%) 100% 0/55% 47% no-repeat,
    linear-gradient(to bottom,#212121 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

.ball-skin-master{
    background:
    radial-gradient(circle at 25% 23%,#f48fb1 0 9%,transparent 10%),

}

/* --- Premier Ball --- */
.ball-skin-premier{

/* --- Luxury Ball --- */
.ball-skin-luxury{

}

.ball-skin-heal{

/* --- Quick Ball --- */
.ball-skin-quick{
    background:
    radial-gradient(circle at 50% 50%,#fff 0 9%,#2d2d2d 10% 14%,transparent 15%),

}

/* --- Timer Ball --- */
.ball-skin-timer{
    background:
    radial-gradient(circle at 50% 50%,#fff 0 9%,#2d2d2d 10% 14%,transparent 15%),

}

/* --- Repeat Ball --- */
.ball-skin-repeat{
    background:
    radial-gradient(circle at 50% 22%,#212121 0 8%,transparent 9%),
    radial-gradient(circle at 35% 29%,#212121 0 5%,transparent 6%),
    radial-gradient(circle at 65% 29%,#212121 0 5%,transparent 6%),
    linear-gradient(to bottom,#fbc02d 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

/* --- Dusk Ball --- */
.ball-skin-dusk{
    background:
    radial-gradient(circle at 35% 24%,#ff5722 0 8%,transparent 9%),
    radial-gradient(circle at 65% 24%,#ff5722 0 8%,transparent 9%),
    linear-gradient(to bottom,#1b5e20 0 47%,#fdd835 47% 53%,#212121 53% 100%);
}

/* --- Net Ball --- */
.ball-skin-net{
    background:
    repeating-linear-gradient(45deg,transparent 0 8px,#212121 8px 10px) 0 0/100% 47% no-repeat,
    repeating-linear-gradient(-45deg,transparent 0 8px,#212121 8px 10px) 0 0/100% 47% no-repeat,
    radial-gradient(circle at 50% 50%,#fff 0 9%,#2d2d2d 10% 14%,transparent 15%),
    linear-gradient(to bottom,#00838f 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

/* --- Dive Ball --- */
.ball-skin-dive{
    background:
    radial-gradient(circle at 50% 23%,#e0f7fa 0 22%,transparent 23%),
    linear-gradient(150deg,transparent 35%,#01579b 36% 43%,transparent 44%) 0 0/50% 47% no-repeat,
    linear-gradient(30deg,transparent 35%,#01579b 36% 43%,transparent 44%) 100% 0/50% 47% no-repeat,
    linear-gradient(to bottom,#0288d1 0 47%,#01579b 47% 53%,#e0f7fa 53% 100%);
}

/* --- Level Ball --- */
.ball-skin-level{
    background:
    radial-gradient(circle at 50% 50%,#fff 0 9%,#2d2d2d 10% 14%,transparent 15%),
    linear-gradient(135deg,transparent 38%,#fbc02d 39% 50%,transparent 51%) 0 0/50% 47% no-repeat,
    linear-gradient(225deg,transparent 38%,#fbc02d 39% 50%,transparent 51%) 100% 0/50% 47% no-repeat,
    linear-gradient(to bottom,#37474f 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

/* --- Lure Ball --- */
.ball-skin-lure{
    background:
    radial-gradient(circle at 50% 50%,#fff 0 9%,#2d2d2d 10% 14%,transparent 15%),
    linear-gradient(135deg,transparent 38%,#e53935 39% 49%,transparent 50%) 0 0/50% 47% no-repeat,
    linear-gradient(225deg,transparent 38%,#e53935 39% 49%,transparent 50%) 100% 0/50% 47% no-repeat,
    linear-gradient(to bottom,#1976d2 0 47%,#fdd835 47% 53%,#f5f5f5 53% 100%);
}

/* --- Moon Ball --- */
.ball-skin-moon{
    background:
    radial-gradient(circle at 35% 22%,#fbc02d 0 15%,transparent 16%),
    radial-gradient(circle at 40% 18%,#1a237e 0 15%,transparent 16%),
    linear-gradient(to bottom,#1a237e 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

/* --- Friend Ball --- */
.ball-skin-friend{
    background:
    radial-gradient(circle at 50% 23%,#fdd835 0 9%,transparent 10%),
    radial-gradient(circle at 50% 23%,#e53935 0 5%,transparent 6%),
    linear-gradient(to bottom,#43a047 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

/* --- Love Ball --- */
.ball-skin-love{
    background:
    radial-gradient(circle at 40% 22%,#ec407a 0 10%,transparent 11%),
    radial-gradient(circle at 60% 22%,#ec407a 0 10%,transparent 11%),
    linear-gradient(45deg,transparent 43%,#ec407a 44% 51%,transparent 52%) 50% 18%/25% 25% no-repeat,
    linear-gradient(315deg,transparent 43%,#ec407a 44% 51%,transparent 52%) 50% 18%/25% 25% no-repeat,
    linear-gradient(to bottom,#f06292 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

/* --- Heavy Ball --- */
.ball-skin-heavy{
    background:
    radial-gradient(circle at 25% 23%,#1976d2 0 9%,transparent 10%),
    radial-gradient(circle at 50% 16%,#1976d2 0 9%,transparent 10%),
    radial-gradient(circle at 75% 23%,#1976d2 0 9%,transparent 10%),
    linear-gradient(to bottom,#607d8b 0 47%,#37474f 47% 53%,#78909c 53% 100%);
}

/* --- Fast Ball --- */
.ball-skin-fast{
    background:
    radial-gradient(circle at 50% 50%,#fff 0 9%,#2d2d2d 10% 14%,transparent 15%),
    linear-gradient(135deg,transparent 37%,#ff5722 38% 51%,transparent 52%) 0 0/100% 47% no-repeat,
    linear-gradient(to bottom,#fbc02d 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

/* --- Sport Ball --- */
.ball-skin-sport{
    background:
    radial-gradient(circle at 50% 25%,#fff 0 12%,transparent 13%),
    radial-gradient(circle at 50% 25%,#2d2d2d 0 4%,transparent 5%),
    linear-gradient(to bottom,#e64a19 0 47%,#2d2d2d 47% 53%,#f5f5f5 53% 100%);
}

/* --- Safari Ball --- */
.ball-skin-safari{
    background:
    radial-gradient(ellipse at 25% 25%,#33691e 0 18%,transparent 19%),
    radial-gradient(ellipse at 72% 28%,#558b2f 0 20%,transparent 21%),
    radial-gradient(ellipse at 38% 70%,#33691e 0 18%,transparent 19%),
    radial-gradient(ellipse at 78% 72%,#7cb342 0 15%,transparent 16%),
    linear-gradient(to bottom,#689f38 0 47%,#2d2d2d 47% 53%,#558b2f 53% 100%);
}

/* --- Dream Ball --- */
.ball-skin-dream{
    background:
    radial-gradient(circle at 50% 25%,#f8bbd0 0 22%,transparent 23%),
    radial-gradient(circle at 50% 25%,#fff 0 8%,transparent 9%),
    linear-gradient(to bottom,#ce93d8 0 47%,#8e24aa 47% 53%,#f8bbd0 53% 100%);
}

/* --- Beast Ball --- */
.ball-skin-beast{
    background:
    radial-gradient(circle at 50% 50%,#fff 0 8%,#000 9% 13%,transparent 14%),

    linear-gradient(-45deg,transparent 34%,#fbc02d 35% 42%,transparent 43%) 0 0/100% 47% no-repeat,

}

    linear-gradient(90deg,transparent 15%,#212121 16% 23%,transparent 24%),
    linear-gradient(270deg,transparent 15%,#212121 16% 23%,transparent 24%),
    linear-gradient(to bottom,#d32f2f 0 47%,#2d2d2d 47% 53%,#b71c1c 53% 100%);
}

/* ==================== 店員選擇彈窗 ==================== */

.staff-picker-row{
    display:flex;
    align-items:center;
    gap:12px;

    background:#fff;
    border:2px solid #ddd;

    border-radius:10px;

    padding:10px;

    margin-bottom:8px;

    cursor:pointer;

    transition:.15s;
}

.staff-picker-row:hover{
    background:#fff8e1;
    border-color:#ff9800;
}

.staff-picker-row.selected{
    background:#fff8e1;
    border-color:#ff9800;

    box-shadow:
        0 0 0 2px #ffcc80;
}

.staff-picker-row img{
    width:65px;
    height:65px;

    object-fit:contain;

    image-rendering:pixelated;
}

.staff-picker-info{
    flex:1;
}

.staff-picker-number{
    font-size:12px;

    color:#777;

    margin-bottom:3px;
}

.staff-picker-name{
    font-size:15px;

    font-weight:bold;

    color:#3e2723;
}

.staff-picker-state{
    font-size:11px;

    color:#4caf50;

    margin-top:4px;
}

.staff-picker-none{
    display:flex;

    align-items:center;

    gap:12px;

    background:#fff;

    border:2px solid #ddd;

    border-radius:10px;

    padding:12px;

    margin-bottom:10px;

    cursor:pointer;
}

.staff-picker-none.selected{
    border-color:#e74c3c;

    background:#ffebee;
}


</style>
</head>
<body>
<div id="header">
<div class="currency-group">
<div class="currency-item">💰 <span id="coin-count">0</span></div>
<div class="currency-item"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/heart-scale.png" class="currency-icon" alt="心之鱗片"><span id="scale-count">0</span></div>
<button class="btn-exchange" onclick="exchangeScales()">兌換</button>
</div>
<button class="btn-kitchen" onclick="goToGarden()">返回秘密花園 🌿</button>
</div>
<div id="game-wrapper">
<div class="grass-top"></div>
<div class="stone-path"></div>
<div class="nav-arrow" id="arrow-left" onclick="changeStall(-1)">◄</div>
<div class="nav-arrow" id="arrow-right" onclick="changeStall(1)">►</div>
<div id="truck-container">
<div id="pokeball-truck" class="pokeball-truck" onclick="openConfigModal()">
<div class="staff-window"><img id="staff-gif" class="staff-gif" src="" alt="店員寶可夢" style="display:none"></div>
<div class="ball-button"><span id="food-icon" class="food-icon">🍱</span></div>
<div class="hanging-sign"><span id="food-status" class="food-status"></span></div>

// ==================== 主遊戲共用存檔 ====================
// 主程式使用 PokeMasterDB / gameData / main_save_v1
const MAIN_DB_NAME="PokeMasterDB";
const MAIN_DB_VERSION=1;
const MAIN_STORE="gameData";
const MAIN_SAVE_KEY="main_save_v1";
const MAIN_BACKUP_1="main_backup_1";
const MAIN_BACKUP_2="main_backup_2";
const MAIN_LS_KEY="pokemaster_v60";
const MAIN_LS_TIME_KEY="pokemaster_v60_timestamp";
let mainDB=null;
let mainData=null;
let mainSaveTimestamp=0;

// 開啟與主程式相同的 IndexedDB
function openMainDB(){
return new Promise((resolve,reject)=>{
if(mainDB){resolve(mainDB);return}
const request=indexedDB.open(MAIN_DB_NAME,MAIN_DB_VERSION);
request.onupgradeneeded=e=>{
const db=e.target.result;
if(!db.objectStoreNames.contains(MAIN_STORE))db.createObjectStore(MAIN_STORE);
};
request.onsuccess=e=>{
mainDB=e.target.result;
mainDB.onversionchange=()=>{try{mainDB.close()}catch(e){}mainDB=null};
resolve(mainDB);
};
request.onerror=()=>reject(request.error);
});
}

function dbGet(key){
return openMainDB().then(db=>new Promise((resolve,reject)=>{
try{
const tx=db.transaction(MAIN_STORE,"readonly");
const req=tx.objectStore(MAIN_STORE).get(key);
req.onsuccess=()=>resolve(req.result??null);
req.onerror=()=>reject(req.error);
}catch(e){reject(e)}
}));
}

function dbPutMany(items){
return openMainDB().then(db=>new Promise((resolve,reject)=>{
try{
const tx=db.transaction(MAIN_STORE,"readwrite");
const store=tx.objectStore(MAIN_STORE);
Object.entries(items).forEach(([key,value])=>{
if(value===undefined)store.delete(key);
else store.put(value,key);
});
tx.oncomplete=()=>resolve(true);
tx.onerror=()=>reject(tx.error);
tx.onabort=()=>reject(tx.error||new Error("DB transaction aborted"));
}catch(e){reject(e)}
}));
}

async function createChecksum(json){
if(!window.crypto?.subtle)return"";
try{
const buffer=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(json));
return Array.from(new Uint8Array(buffer)).map(b=>b.toString(16).padStart(2,"0")).join("");
}catch(e){return""}
}

async function validateEnvelope(envelope){
if(!envelope||typeof envelope!=="object")return null;
if(envelope.format==="PokeMasterMainSave"&&typeof envelope.json==="string"){
try{
const data=JSON.parse(envelope.json);
if(envelope.checksum&&window.crypto?.subtle){
const checksum=await createChecksum(envelope.json);
if(checksum!==envelope.checksum)return null;
}
return{data,timestamp:Number(envelope.timestamp)||0};
}catch(e){return null}
}
if(!envelope.format&&typeof envelope==="object")return{data:envelope,timestamp:0};
return null;
}

// 讀取主程式目前最新資料
async function loadMainGameData(){
try{
let candidates=[];
const current=await validateEnvelope(await dbGet(MAIN_SAVE_KEY));
const backup1=await validateEnvelope(await dbGet(MAIN_BACKUP_1));
const backup2=await validateEnvelope(await dbGet(MAIN_BACKUP_2));
if(current)candidates.push({data:current.data,timestamp:current.timestamp});
if(backup1)candidates.push({data:backup1.data,timestamp:backup1.timestamp});
if(backup2)candidates.push({data:backup2.data,timestamp:backup2.timestamp});
try{
const raw=localStorage.getItem(MAIN_LS_KEY);
const timestamp=Number(localStorage.getItem(MAIN_LS_TIME_KEY))||0;
if(raw)candidates.push({data:JSON.parse(raw),timestamp});
}catch(e){}
if(!candidates.length)throw new Error("找不到主遊戲存檔");
candidates.sort((a,b)=>b.timestamp-a.timestamp);
mainData=candidates[0].data;
mainSaveTimestamp=candidates[0].timestamp||Date.now();
if(!mainData||typeof mainData!=="object")throw new Error("主遊戲資料格式錯誤");
if(!mainData.farm)mainData.farm={};
if(!mainData.farm.dishes)mainData.farm.dishes={};
if(!mainData.farm.foodTruck)mainData.farm.foodTruck={};
return true;
}catch(e){
console.error("❌ 無法讀取主遊戲資料:",e);
alert("無法讀取主遊戲存檔，請先開啟一次主遊戲後再進入餐車。");
return false;
}
}

// 將餐車修改後的 s 完整寫回主程式存檔
async function saveMainGameData(){
if(!mainData)return false;
const timestamp=Date.now();
const json=JSON.stringify(mainData);
const envelope={
format:"PokeMasterMainSave",
version:1,
timestamp,
json,
checksum:await createChecksum(json)
};
try{
const current=await dbGet(MAIN_SAVE_KEY);
const backup1=await dbGet(MAIN_BACKUP_1);
const writes={[MAIN_SAVE_KEY]:envelope};
if(current)writes[MAIN_BACKUP_1]=current;
if(backup1)writes[MAIN_BACKUP_2]=backup1;
await dbPutMany(writes);
try{
localStorage.setItem(MAIN_LS_KEY,json);
localStorage.setItem(MAIN_LS_TIME_KEY,String(timestamp));
}catch(e){}
mainSaveTimestamp=timestamp;
return true;
}catch(e){
console.error("❌ 餐車寫回主存檔失敗:",e);
return false;
}
}

// ==================== 心之鱗片兌換 ====================
async function exchangeScales(){
const RATE=3000;
const maxScales=Math.floor(coins/RATE);
if(maxScales<=0){
alert(`金幣不足！至少需要 ${RATE} 金幣才能兌換 1 片心之鱗片。`);
return;
}
const input=prompt(`請輸入欲兌換的心之鱗片數量：\n(${RATE} 金幣 = 1 片心之鱗片)\n目前金幣：💰 ${coins}\n最多可兌換：${maxScales} 片`,"1");
if(input===null)return;
const amount=parseInt(input);
if(isNaN(amount)||amount<=0){
alert("請輸入有效的數量！");
return;
}
const cost=amount*RATE;
if(coins<cost){
alert(`金幣不足！兌換 ${amount} 片需要 💰 ${cost}。`);
return;
}
if(!confirm(`兌換 ${amount} 片心之鱗片？\n花費 💰 ${cost} 金幣。`))return;
mainData.bal-=cost;
heartScales+=amount;
syncTruckToMain();
await saveMainGameData();
updateUI();
alert(`成功兌換 ${amount} 片心之鱗片！`);
}

                        Number.isFinite(id) &&
                        id > 0
                    )

        Array.isArray(mainData?.pkm)
            ? mainData.pkm
            : [];

    return [
        ...new Set(
            unlocked
                .map(p => Number(p?.id))
                .filter(id =>
                    Number.isFinite(id) &&
                    id > 0
                )
        )
    ];

}

function startCustomerLoop(){
if(customerTimer)clearTimeout(customerTimer);
scheduleNextCustomer(500);
}

function scheduleNextCustomer(delay){
if(customerTimer)clearTimeout(customerTimer);
customerTimer=setTimeout(spawnCustomer,delay);
}

function spawnCustomer(){
    const stall=getCurrentStall();

    if(!stall.unlocked||!stall.staffId||!stall.recipe||stall.stock<=0){
        scheduleNextCustomer(2000);
        return;
    }

    if(customerBusy){
        scheduleNextCustomer(1000);
        return;
    }

    customerBusy=true;

    const layer=document.getElementById("customers-layer");
    const customer=document.createElement("div");

    // 取得秘密花園完整寶可夢名單
    const customerPokemonList=getCustomerPokemonList();

    // 沒有寶可夢資料就等待下一次
    if(customerPokemonList.length===0){
        customerBusy=false;
        scheduleNextCustomer(2000);
        return;
    }

    // 隨機挑選顧客
    const randomPokeId=
        customerPokemonList[
            Math.floor(
                Math.random()*customerPokemonList.length
            )
        ];

    customer.className="customer-container";
    customer.style.left="150px";
    customer.style.top="585px";

    customer.innerHTML=`
        <div class="speech-bubble" style="display:none">
            點餐中..
        </div>

        <img
            class="customer-gif"
            alt="顧客寶可夢"
        >
    `;

    const customerImg=
        customer.querySelector(".customer-gif");

    // GIF失敗自動改用PNG
    setPokemonImage(customerImg,randomPokeId);

    layer.appendChild(customer);

    requestAnimationFrame(()=>{
        setTimeout(()=>{
            customer.style.top="245px";
        },80);
    });

    setTimeout(async()=>{
        if(!customer.isConnected)return;

        const bubble=
            customer.querySelector(".speech-bubble");

        if(bubble){
            bubble.style.display="block";
        }

        const current=getCurrentStall();

        if(
            current===stall&&
            stall.unlocked&&
            stall.staffId&&
            stall.recipe&&
            stall.stock>0
        ){
            const available=
                getDishCount(stall.recipe);

            if(available>0){
                setDishCount(
                    stall.recipe,
                    available-1
                );

                stall.stock--;

                mainData.bal=
                    (Number(mainData.bal)||0)+
                    (RECIPES[stall.recipe]?.price||1);

                heartScales++;

                coins=mainData.bal;

                updateUI();
                renderTruck();

                await saveTruck();
            }
        }

        setTimeout(()=>{
            if(!customer.isConnected)return;

            if(bubble){
                bubble.style.display="none";
            }

            customer.style.top="585px";

            setTimeout(()=>{
                customer.remove();
                customerBusy=false;
                scheduleNextCustomer(500);
            },6000);

        },13000);

    },6100);
}

// ==================== 餐車離線販售 ====================

// 取得指定餐車最後結算時間
function getFoodTruckStamp(truckId){
    const key=`foodTruck_lastStamp_${truckId}`;
    const saved=Number(localStorage.getItem(key));

    // 第一次使用時，從現在開始計算
    if(!saved){
        const now=Date.now();
        localStorage.setItem(key,String(now));
        return now;
    }

    return saved;
}


// 更新指定餐車最後結算時間
function updateFoodTruckStamp(truckId,time=Date.now()){
    const key=`foodTruck_lastStamp_${truckId}`;
    localStorage.setItem(key,String(time));
}


// 計算離線期間理論販售數量
function calculateFoodTruckOfflineSales(truckId){

    const now=Date.now();
    const lastStamp=getFoodTruckStamp(truckId);

    const fiveMinutes=5*60*1000;

    const elapsed=now-lastStamp;

    if(elapsed<fiveMinutes)return 0;

    return Math.floor(elapsed/fiveMinutes);
}


// ==================== 離線販售結算 ====================
async function settleFoodTruckOfflineSales(truckId){

    const stall=stalls[truckId];

    if(!stall)return 0;


    const now=Date.now();
    const lastStamp=getFoodTruckStamp(truckId);

    const fiveMinutes=5*60*1000;


    // ====================
    // 1. 計算理論販售量
    // ====================

    const elapsed=now-lastStamp;

    const theoreticalSales=
        Math.floor(elapsed/fiveMinutes);


    // 不足 5 分鐘
    if(theoreticalSales<=0)return 0;


    // ====================
    // 2. 檢查餐車是否可以營業
    // ====================

    if(
        !stall.unlocked||
        !stall.staffId||
        !stall.recipe
    ){
        // 尚未營業
        // 從現在重新開始計時
        updateFoodTruckStamp(truckId,now);

        return 0;
    }


    // ====================
    // 3. 檢查架上料理
    // ====================

    const shelfStock=
        Math.max(
            0,
            Number(stall.stock)||0
        );


    // ====================
    // 4. 理論值 vs 架上數量
    //
    // 架上 >= 理論值
    // → 賣理論值
    //
    // 架上 < 理論值
    // → 賣架上全部
    // ====================

    const actualSales=
        Math.min(
            theoreticalSales,
            shelfStock
        );


    // ====================
    // 5. 沒有料理可以賣
    // ====================

    if(actualSales<=0){

        // 架上已經沒有料理
        // 不讓時間一直累積
        updateFoodTruckStamp(truckId,now);

        return 0;
    }


    // ====================
    // 6. 檢查秘密花園料理
    // ====================

    const dishCount=
        Math.max(
            0,
            Number(getDishCount(stall.recipe))||0
        );


    // 實際能賣出的數量
    // 還要受到秘密花園料理數量限制
    const finalSales=
        Math.min(
            actualSales,
            dishCount
        );


    // ====================
    // 7. 秘密花園料理不足
    // ====================

    if(finalSales<=0){

        // 沒有料理可以供應
        updateFoodTruckStamp(truckId,now);

        return 0;
    }


    // ====================
    // 8. 扣除秘密花園料理
    // ====================

    setDishCount(
        stall.recipe,
        dishCount-finalSales
    );


    // ====================
    // 9. 扣除架上料理
    // ====================

    stall.stock=
        Math.max(
            0,
            shelfStock-finalSales
        );


    // ====================
    // 10. 計算收益
    // ====================

    const price=
        Number(
            RECIPES[stall.recipe]?.price
        )||1;


    const income=
        finalSales*price;


    // 增加金幣
    mainData.bal=
        (Number(mainData.bal)||0)+income;


    // 增加心之鱗片
    heartScales+=finalSales;


    // 同步金幣
    coins=mainData.bal;


    // ====================
    // 11. 更新時間戳記
    // ====================

    /*
       如果架上料理足夠：

       例如：
       離線 1 小時
       理論販售 12
       架上 20

       → 賣 12
       → 時間完整往前推 60 分鐘
    */

    if(shelfStock>=theoreticalSales){

        const newStamp=
            lastStamp+
            theoreticalSales*fiveMinutes;

        updateFoodTruckStamp(
            truckId,
            Math.min(newStamp,now)
        );

    }else{

        /*
           如果架上料理不足：

           例如：
           離線 1 小時
           理論販售 12
           架上只有 5

           → 只賣 5

           架上已經在第 25 分鐘賣完，
           所以不能讓剩餘 35 分鐘
           繼續累積成未來的販售量。

           直接把時間重置到現在。
        */

        updateFoodTruckStamp(
            truckId,
            now
        );
    }
    // ====================
    // 12. 更新畫面
    // ====================
    updateUI();
    if(
        Number(currentStallIndex)===
        Number(truckId)
    ){
        renderTruck();
    }
    // ====================
    // 13. 儲存
    // ====================

    syncTruckToMain();
    await saveMainGameData();
    return finalSales;
}

// ==================== 店員：只顯示已正式加入 s.pkm 的寶可夢，並依圖鑑號碼排序 ====================
function getEligibleStaff(){

    /* 
       餐車店員直接讀取主遊戲：
       mainData.pkm

       這就是秘密花園冒險小隊可使用的
       寶可夢資料來源
    */

    const list =
    Array.isArray(mainData?.pkm)
        ? mainData.pkm.filter(p => p && p.unlocked !== false)
        : [];

    const seen=new Set();

    return list

        .filter(p=>{

            return p &&
                Number.isFinite(
                    Number(p.id)
                );

        })

        /* 
           相同圖鑑編號只顯示一次
        */

        .filter(p=>{

            const id=
                Number(p.id);

            if(seen.has(id)){
                return false;
            }

            seen.add(id);

            return true;

        })

        .map(p=>({

            id:Number(p.id),

            name:
                p.name ||
                getPokemonName(
                    Number(p.id)
                ),

            uniqueId:
                p.uniqueId || "",

            color:
                p.color || ""

        }))

        /*
           依照圖鑑編號排序
        */

        .sort((a,b)=>{

            return a.id-b.id;

        });

}

function changeStaffPage(
    direction
){

    const staff=
        getEligibleStaff();


    const totalPages=
        Math.max(
            1,
            Math.ceil(
                staff.length /
                STAFF_PER_PAGE
            )
        );


    staffPickerPage+=
        direction;


    if(
        staffPickerPage<0
    ){

        staffPickerPage=0;

    }


    if(
        staffPickerPage>=
        totalPages
    ){

        staffPickerPage=
            totalPages-1;

    }


    renderStaffPicker();

}


/* ====================
   渲染店員列表
==================== */

function renderStaffPicker(){
    const container=document.getElementById("staff-picker-list");
    const pageText=document.getElementById("staff-picker-page");
    const prevButton=document.getElementById("staff-prev-btn");
    const nextButton=document.getElementById("staff-next-btn");

    container.innerHTML="";

    const staff=getEligibleStaff()
        .slice()
        .sort((a,b)=>Number(a.id)-Number(b.id));

    const totalPages=Math.max(
        1,
        Math.ceil(staff.length/STAFF_PER_PAGE)
    );

    if(staffPickerPage>=totalPages){
        staffPickerPage=totalPages-1;
    }

    const start=staffPickerPage*STAFF_PER_PAGE;
    const end=Math.min(start+STAFF_PER_PAGE,staff.length);
    const pageStaff=staff.slice(start,end);

    /* 不配置店員 */
    const noneRow=document.createElement("div");

    noneRow.className=
        "staff-picker-none"+
        (configDraft.staffId===null?" selected":"");

    noneRow.innerHTML=`
        <div style="font-size:38px;width:55px;text-align:center">
            ❌
        </div>
        <div>
            <strong>不配置店員</strong><br>
            <span style="font-size:12px;color:#777">
                餐車將停止營業
            </span>
        </div>
    `;

    noneRow.onclick=()=>{
        configDraft.staffId=null;
        closeStaffPicker();
        renderStaffGrid();
    };

    container.appendChild(noneRow);

    /* 沒有可選寶可夢 */
    if(staff.length===0){
        const empty=document.createElement("div");

        empty.style.cssText=`
            padding:25px;
            text-align:center;
            color:#777;
        `;

        empty.innerText=
            "目前冒險小隊中沒有可選擇的寶可夢。";

        container.appendChild(empty);
    }

    /* 顯示本頁寶可夢 */
    pageStaff.forEach(pokemon=>{
        const row=document.createElement("div");

        const selected=
            Number(configDraft.staffId)===Number(pokemon.id);

        row.className=
            "staff-picker-row"+
            (selected?" selected":"");

        row.innerHTML=`
            <img
                alt="${pokemon.name}"
                data-pokemon-id="${pokemon.id}"
            >

            <div class="staff-picker-info">
                <div class="staff-picker-number">
                    No.${String(pokemon.id).padStart(3,"0")}
                </div>

                <div class="staff-picker-name">
                    ${pokemon.name}
                </div>

                <div class="staff-picker-state">
                    冒險小隊成員
                </div>
            </div>
        `;

         /* GIF失敗自動改用PNG */
        const img=row.querySelector("img");
            setPokemonImage(
               img,
               pokemon.id
          );

        row.onclick=()=>{
            configDraft.staffId=pokemon.id;
            closeStaffPicker();
            renderStaffGrid();
        };

        container.appendChild(row);
    });

    /* 頁碼 */
    pageText.innerText=
        `第 ${staffPickerPage+1} / ${totalPages} 頁｜共 ${staff.length} 隻`;

    prevButton.disabled=staffPickerPage<=0;
    nextButton.disabled=staffPickerPage>=totalPages-1;
}

function getRefillAmount(){
const input=document.getElementById("refill-input");
if(!input)return 0;
let value=parseInt(input.value);
if(isNaN(value)||value<0)value=0;
if(value>99)value=99;
return value;
}

function updateStockSummary(){
const box=document.getElementById("stock-summary");
if(!configDraft.recipe){
box.innerText="尚未選擇料理。";
return;
}
const refill=getRefillAmount();
const current=Number(configDraft.stock)||0;
const total=Math.min(99,current+refill);
const mainDishCount=getDishCount(configDraft.recipe);
box.innerHTML=`目前餐車庫存：<strong>${current} 份</strong><br>本次補充：<strong>+${refill} 份</strong><br>確認後餐車庫存：<strong>${total} 份</strong><br>主遊戲目前料理庫存：<strong>${mainDishCount} 份</strong><br>售價：💰 ${RECIPES[configDraft.recipe].price} / 份`;
}

// ==================== 套用設定：補貨時直接扣主遊戲料理 ====================
async function confirmConfig(){
const stall=getCurrentStall();
if(!configDraft.recipe){
if(!confirm("目前沒有選擇料理，餐車將停止販售。確定嗎？"))return;
}
const refill=getRefillAmount();
const current=Number(configDraft.stock)||0;
if(refill>0&&configDraft.recipe){
const available=getDishCount(configDraft.recipe);
if(available<refill){
alert(`主遊戲料理庫存不足！\n需要 ${refill} 份，目前只有 ${available} 份。`);
return;
}
setDishCount(configDraft.recipe,available-refill);
}
stall.skinId=configDraft.skinId||"poke";
stall.staffId=configDraft.staffId||null;
stall.recipe=configDraft.recipe||"";
stall.stock=stall.recipe?Math.min(99,current+refill):0;
await saveTruck();
renderTruck();
closeModal("config-modal");
updateUI();
if(stall.recipe&&stall.staffId)alert(`${stall.name} 設定完成！`);
}

function renderShop(){

container.innerHTML="";
stalls.forEach(stall=>{

const canAfford=heartScales>=stall.price;
const item=document.createElement("div");
item.className="shop-item";
item.innerHTML=`<div><strong>${stall.name}</strong><br><span class="shop-price"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/heart-scale.png" class="currency-icon"> ${stall.price} 心之鱗片</span></div><button class="btn-kitchen" ${stall.unlocked||!canAfford?"disabled":""}>${stall.unlocked?"已解鎖":canAfford?"購買":"鱗片不足"}</button>`;
if(!stall.unlocked&&canAfford)item.querySelector("button").onclick=()=>buyStall(stall.id);
container.appendChild(item);
});
}

async function buyStall(id){
const stall=stalls[id];
if(!stall||stall.unlocked)return;
if(heartScales<stall.price){
alert("心之鱗片不足！");
return;
}
if(!confirm(`花費 ${stall.price} 片心之鱗片解鎖 ${stall.name}？`))return;
heartScales-=stall.price;
stall.unlocked=true;
await saveTruck();
updateUI();
renderShop();
renderTruck();
}
